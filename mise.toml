#:schema https://mise.jdx.dev/schema/mise.json
# The repo-specific half of the task and toolchain definitions. The shared
# half arrives through vendir: tool pins in .config/mise/conf.d/, tasks
# under .devtools/tasks/ selected by the task_config includes below.

[settings]
lockfile = true
# uv owns any Python interpreter; stop mise from reading .python-version too.
idiomatic_version_file_enable_tools = []

[tools]
"go:github.com/tbhb-dev/devtools/cmd/guard-markdown" = "v0.14.0"
"go:github.com/tbhb-dev/devtools/cmd/commit-lint" = "v0.14.0"
"go:github.com/tbhb-dev/devtools/cmd/agentrepo" = "v0.14.0"
# vendir can't come from the payload it delivers: bootstrap syncs before it installs.
vendir = "0.46.2"
apm = "0.33.0"
shfmt = "3.14.1"
jq = "1.8.2"
# Runs the shared APM audit and the Python toolchain.
uv = "0.13.1"
# JS/TS workspace package manager; package.json packageManager names the same version.
pnpm = "12.14.0"

[env]
DEVTOOLS_LOCK_PLATFORMS = "linux-x64,macos-arm64"
UV_PYTHON_PREFERENCE = "only-managed"
DEVTOOLS_PROSE_GLOB = "!{LICENSE,CHANGELOG.md,.vale/*,tmp/*,vendor/*,infra/ansible/.collections/*,node_modules/*,.nx/*,.venv/*,.pytest_cache/*,apm_modules/*,.claude/worktrees/*,.codex/worktrees/*,.worktrees/*,COMMIT_AGENTMSG,PR_AGENTDESC.md,SQUASH_AGENTMSG}"

[task_config]
includes = [
  ".devtools/tasks/apm.toml",
  ".devtools/tasks/fix.toml",
  ".devtools/tasks/format.toml",
  ".devtools/tasks/git-hooks.toml",
  ".devtools/tasks/leaks.toml",
  ".devtools/tasks/lint.toml",
  ".devtools/tasks/pins.toml",
  ".devtools/tasks/preapproval.toml",
  ".devtools/tasks/security.toml",
  ".devtools/tasks/toolchain.toml",
  ".devtools/tasks/vendir.toml",
]

[tasks.bootstrap]
description = "Sync the vendored payload, install the toolchain, and install git hooks"
alias = "setup"
run = [
  "vendir sync",
  "mise run install-toolchain",
  "mise run install-tools",
  "mise run install-guard-markdown",
  "mise run devtools:prek-install",
  "mise run devtools:install-pre-push-hook",
]

[tasks.install-toolchain]
description = "Install the pinned toolchain from mise.toml and the vendored conf.d"
run = "mise install"

[tasks.install-tools]
description = "Download the Vale style packages .vale.ini names"
run = "vale sync"

# mise puts the pinned guard-markdown on PATH for lint and agent hooks.
[tasks.install-guard-markdown]
description = "Install the mise-managed guard-markdown pin"
run = "mise install go:github.com/tbhb-dev/devtools/cmd/guard-markdown"

[tasks.check-vendored]
description = "Fail when the vendored payload differs from what vendir.lock.yml pins, without touching the checkout"
run = "bash tools/check-vendored.sh"

# Shared sync reconciles APM-owned hooks and audits the deployment.
# Keep the consumer deployment check on manual syncs and in lint: the
# updater calls devtools:apm-sync directly.
[tasks.apm-sync]
description = "Redeploy and audit APM primitives, then check the consumer deployment"
depends_post = ["lint-apm-deploy"]
run = "mise run devtools:apm-sync"

# The bare devtools pin plus `target: [claude, codex]` is assumed to
# deploy the claude, common, and codex packages and nothing for
# antigravity (D13). This holds that assumption to the recorded deploy.
[tasks.lint-apm-deploy]
description = "Fail when the deployed APM primitives differ from the recorded frozen-consumer set"
run = "bash tools/check-apm-deploy.sh"

[tasks.lint-commit-msg]
extends = "devtools:lint-commit-msg"

[tasks.lint-squash-msg]
extends = "devtools:lint-squash-msg"

# .leak-skip excludes vendor/ only in working-tree mode. Staged, range,
# pre-push and explicit-file scans still check vendored content.
[tasks.lint-leaks]
description = "Scan the working tree for private values, except the vendored Go modules"
quiet = true
run = "mise run devtools:lint-leaks"

# The pull request counterpart the pr skill calls. Body copied from
# devtools/mise.toml [tasks.lint-pr-description]; validate-description.sh
# exists once apm install has deployed the pr skill.
[tasks.lint-pr-description]
extends = "devtools:lint-pr-description"
run = [
  "bash .claude/skills/pr/scripts/validate-description.sh",
  "vale --output=ai-tells-agent.tmpl PR_AGENTDESC.md",
  "cspell --config .cspell.jsonc --no-summary --no-progress PR_AGENTDESC.md",
  "bash .devtools/scripts/check-leaks.sh PR_AGENTDESC.md",
]

# Shared draft tasks keep the consumer's Vale and spelling policy.
[tasks.lint-draft]
extends = "devtools:lint-draft"

[tasks.fix-prose-replacements]
extends = "devtools:fix-prose-replacements"

[tasks.lint-prose]
extends = "devtools:lint-prose"

[tasks.lint-markdown-wrap]
description = "Fail if any Markdown paragraph spans more than one line"
run = "mise run devtools:lint-markdown-wrap"

# Keep these local names for hooks and existing callers.
[tasks.lint-shell]
description = "Lint the shell scripts via shellcheck"
run = "mise run devtools:lint-shell"

[tasks.lint-shell-fmt]
description = "Fail if shfmt would reformat any shell script"
run = "mise run devtools:lint-shell-fmt"

[tasks.lint]
extends = "devtools:lint"
run = [
  "mise run check-vendored",
  "mise run lint-leaks",
  "mise run devtools:check-leak-hook",
  "mise run devtools:check-pins",
  "mise run devtools:lint-apm",
  "mise run lint-apm-deploy",
  "mise run lint-go-all",
  # Restore Python lint when first-party Python lands or devtools v0.14.1 skips empty trees.
  "mise run lock-check",
  "mise run lint-prose",
  "mise run devtools:lint-spelling",
  "mise run devtools:lint-markdown",
  "mise run lint-markdown-wrap",
  "mise run devtools:lint-config",
  "mise run devtools:lint-yaml",
  "mise run devtools:lint-toml",
  "mise run devtools:lint-workflows",
  "mise run devtools:lint-mise",
  "mise run lint-shell",
  "mise run lint-shell-fmt",
  "mise run devtools:lint-curl",
  "mise run lint-ansible",
]

[tasks.test-vendored]
description = "Test the vendored-payload drift gate on a copy of the tree"
run = "bats tools/check-vendored.bats"

[tasks.test-tools]
description = "Test draft task failures, ops task refusals, and leak gate rules"
run = "bats tools/fix-prose-replacements.bats tools/ops-ansible.bats tools/leak-patterns.bats tools/owner-paths.bats"

[tasks.test]
description = "Run every test suite"
run = [
  "mise run test-vendored",
  "mise run test-tools",
  "mise run test-go",
  "mise run cover-go",
  "mise run test-py",
  "mise run test-ansible",
]

[tasks.check]
description = "Fast quality bar: lint then test"
run = ["mise run lint", "mise run test"]

[tasks.check-all]
description = "Deeper bar: check plus the full-history gitleaks scan"
run = ["mise run check", "mise run devtools:gitleaks"]

# --- Go tasks, copied from devtools/mise.toml (upstream candidate: tbhb-dev/devtools#157) ---

[tasks.build]
description = "Build every binary into the bin directory"
run = 'CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "$(bash .devtools/scripts/go-ldflags.sh)" -o bin/ ./cmd/...'

[tasks.install]
description = "Install every binary to GOPATH/bin"
run = 'CGO_ENABLED=0 go install -trimpath -buildvcs=false -ldflags "$(bash .devtools/scripts/go-ldflags.sh)" ./cmd/...'

# The first argument names the ./cmd/<bin> package; the rest pass
# through to it. No usage spec, because a spec declaring one argument
# rejects the trailing ones: without it every invocation argument
# arrives as a shell positional in a shebang body.
[tasks.run]
description = "Run one binary by name, e.g. `mise run run techopsctl version`"
run = '''
#!/usr/bin/env bash
set -euo pipefail
bin=$1
shift
go run -ldflags "$(bash .devtools/scripts/go-ldflags.sh)" "./cmd/$bin" "$@"
'''

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf bin dist .nx/cache coverage.out coverage.html coverage.txt coverage.xml coverage.covdata*"

[tasks.format-go]
description = "Format Go code via golangci-lint's formatters"
run = "golangci-lint fmt"

# `go fix` (Go 1.26+) runs the modernizer analyzers; the blog post
# (https://go.dev/blog/gofix) recommends running it to a fixed point --
# usually one extra pass picks up fixes that became valid after the
# first round. golangci-lint fmt + --fix run afterward.
# --modules-download-mode=vendor matches the build, so the linter sees
# exactly the dependency set the compiler does and never falls back to
# the module proxy.
[tasks.fix-go]
description = "Fix Go linting issues"
run = [
  "go fix ./...",
  "go fix ./...",
  "golangci-lint fmt",
  "golangci-lint run --fix --modules-download-mode=vendor",
]

[tasks.lint-go]
description = "Run Go linters via golangci-lint (vendor-mode)"
run = "golangci-lint run --modules-download-mode=vendor"

# The check counterpart of format-go: prints the diff and fails, and writes nothing.
[tasks.lint-go-fmt]
description = "Fail if golangci-lint's formatters would change any Go file"
run = "golangci-lint fmt --diff ./cmd/... ./internal/..."

# The compiler covers cycles and cross-module visibility; this catches
# the layer rules it can't (e.g., "cmd may depend on internal but not
# the reverse").
[tasks.lint-go-arch]
description = "Enforce intra-project layering rules from .go-arch-lint.yml"
run = "go-arch-lint check"

# Mirrors the vendor-drift check: contributors must run
# `mise run fix-go` before pushing.
[tasks.lint-go-modernize]
description = "Fail if `go fix` would modernize the tree"
run = '''
#!/usr/bin/env bash
set -eu
diff_output=$(go fix -diff ./... 2>&1)
if [[ -n "$diff_output" ]]; then
    echo "go fix would modernize the tree — run 'mise run fix-go' and commit:" >&2
    echo "$diff_output" >&2
    exit 1
fi
'''

# Whole-program reachability complements the package-scoped `unused`
# linter in golangci-lint. The tool prints findings but exits 0, so any
# output is treated as failure.
[tasks.lint-go-deadcode]
description = "Fail if `deadcode` finds unreachable functions from the binary entry points"
run = '''
#!/usr/bin/env bash
set -eu
output=$(go tool deadcode ./cmd/... 2>&1)
if [[ -n "$output" ]]; then
    echo "deadcode found unreachable code — remove or justify:" >&2
    echo "$output" >&2
    exit 1
fi
'''

# Noisier; intentionally not part of the default lint gate. Run before
# wholesale refactors to surface code only kept alive by tests.
[tasks.lint-go-deadcode-tests]
description = "Like lint-go-deadcode but roots reachability at every test binary too"
run = '''
#!/usr/bin/env bash
set -eu
output=$(go tool deadcode -test ./... 2>&1)
if [[ -n "$output" ]]; then
    echo "deadcode (with -test) found unreachable code:" >&2
    echo "$output" >&2
    exit 1
fi
'''

# Extra invocation args append to the run string, so `mise run test-go
# -- -run TestFoo` reaches `go test` unchanged.
[tasks.test-go]
description = "Run the Go tests"
run = "go test ./..."

# Slower than plain test-go; pairs with goroutine-bearing code as it
# lands. Native fuzz targets discovered by the nightly workflow rerun
# under -race automatically when their function-under-test is reached
# from -race builds; for ad-hoc local runs use this task.
[tasks.test-go-race]
description = "Run the Go tests with the race detector"
run = "go test -race ./..."

# Gremlins gates each mutant's test run at
# `coefficient * baseline_test_time`. The upstream default of 3 leaves a
# budget of a few hundred milliseconds for this project's sub-second test
# suites, so legitimate assertion kills get reclassified as TIMED OUT
# under any noticeable system load. 100 keeps the per-mutation worst case
# under a minute. Override by setting GREMLINS_TIMEOUT_COEFFICIENT.
[tasks.mutate-go]
description = "Run mutation testing via gremlins"
usage = 'arg "<path>" default="."'
run = 'go tool gremlins unleash --timeout-coefficient "${GREMLINS_TIMEOUT_COEFFICIENT:-100}" $usage_path'

# The nightly form, factored out so the mutation-nightly workflow has a
# single task to invoke and contributors can run the same scan locally
# before opening a release-bound PR.
[tasks.mutate-go-all]
description = "Mutate the whole module from the repository root"
run = 'go tool gremlins unleash --timeout-coefficient "${GREMLINS_TIMEOUT_COEFFICIENT:-100}" .'

# .devtools/scripts/fuzz.sh lists every Fuzz* function under each package and runs it
# for the FUZZ_TIME budget (default 30s); the nightly workflow calls the
# same script with a longer FUZZ_TIME.
[tasks.fuzz-go]
description = "Run native Go fuzz targets under [path] (default the entire module)"
usage = 'arg "<path>" default="./..."'
run = "bash .devtools/scripts/fuzz.sh $usage_path"

[tasks.cover-go]
description = "Run the Go tests with coverage, print the per-function breakdown, and enforce the .testcoverage.yml thresholds"
run = '''
#!/usr/bin/env bash
set -euo pipefail
go test -coverprofile=coverage.out ./...
echo
go tool cover -func=coverage.out | tail -n 30
echo
go tool go-test-coverage --config .testcoverage.yml
'''

# Highlights covered and uncovered regions in source view so a
# contributor can find exactly where a new test should land. Wraps
# `go tool cover -html`.
[tasks.cover-go-html]
description = "Open the HTML coverage report"
run = [
  "go test -coverprofile=coverage.out ./...",
  "go tool cover -html=coverage.out",
]

# Cobertura is the lingua franca format coverage dashboards accept. This
# is the quick local form; CI's per-slot and combined uploads flow
# through cover-go-binary and cover-go-merge below.
[tasks.cover-go-cobertura]
description = "Emit a Cobertura XML report from one local text profile"
run = [
  "go test -coverprofile=coverage.out ./...",
  "go tool gocover-cobertura < coverage.out > coverage.xml",
]

# CI uploads the binary covdir per matrix slot so the downstream coverage
# job can merge the slots with `go tool covdata merge` (see cover-go-merge)
# into one combined report -- a merge only the binary format supports
# losslessly. The covdir is absolute because `go test` runs each
# package's binary from that package's directory, which would scatter a
# relative path. MISE_PROJECT_ROOT stands in for justfile_directory(): on Windows it arrives as a native path while $PWD
# is the Git Bash form, and go needs the native one.
[tasks.cover-go-binary]
description = "Run the Go tests into <covdir> as binary coverage, then render Cobertura XML"
usage = 'arg "<covdir>" default="coverage.covdata"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
covdir="$MISE_PROJECT_ROOT/$usage_covdir"
rm -rf "$covdir"
mkdir -p "$covdir"
go test ./... -cover -args -test.gocoverdir="$covdir"
go tool covdata textfmt -i="$covdir" -o=coverage.out
go tool gocover-cobertura < coverage.out > coverage.xml
'''

# Takes one subdirectory per slot under <slotsdir>, merges them into a
# single profile, and renders the combined Cobertura XML to coverage.xml.
# CI runs this in the downstream coverage job after collecting every
# slot's uploaded covdata.
[tasks.cover-go-merge]
description = "Merge the per-slot binary coverage dirs into one report"
usage = 'arg "<slotsdir>" default="coverage.covdata.slots"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
rm -rf coverage.covdata.merged
mkdir -p coverage.covdata.merged
go tool covdata merge -i="$(ls -d "$usage_slotsdir"/*/ | paste -sd, -)" -o=coverage.covdata.merged
go tool covdata textfmt -i=coverage.covdata.merged -o=coverage.out
go tool gocover-cobertura < coverage.out > coverage.xml
'''

# The bare check separates a CI step that runs tests itself from the
# threshold enforcement, and gives a contributor a way to re-check after
# editing .testcoverage.yml without rerunning the suite.
[tasks.cover-go-check]
description = "Run only the threshold gate against an existing coverage.out"
run = "go tool go-test-coverage --config .testcoverage.yml"

# govulncheck walks the call graph and reports only vulnerabilities whose
# vulnerable symbols this module actually calls. Pinned as a `go tool`
# dep in go.mod so the scanner version is reproducible; bumped via
# Renovate.
[tasks.vuln]
description = "Scan the module for known vulnerabilities reachable from the binary entry points"
run = "go tool govulncheck ./..."

# govulncheck exits 0 in SARIF mode whether or not it finds
# vulnerabilities -- the report has them -- so this task surfaces
# findings through Code Scanning rather than failing the run, while a
# genuine scanner failure still exits non-zero.
[tasks.vuln-sarif]
description = "Emit the govulncheck results as SARIF to <file> for the security.yml upload"
usage = 'arg "<file>"'
run = 'go tool govulncheck -format sarif ./... > "$usage_file"'

# gomodscan flags dependencies that pkg.go.dev marks as retracted or
# deprecated (S2C2F SCA-3), and dependencies the OSV malicious-package
# registry flags as malware (S2C2F ING-3). It reads vendor/modules.txt
# for the module set, so run `mise run vendor` first when it is stale.
# Exits 1 on findings, 2 on tool failure.
[tasks.gomodscan]
description = "Scan each vendored module for supply-chain concerns in one pass"
run = "go tool gomodscan"

# Unlike the gomodscan gate task, a findings exit (1) does not fail this
# one -- Code Scanning surfaces severity downstream -- but a tool failure
# (exit 2) still propagates.
[tasks.gomodscan-sarif]
description = "Emit the gomodscan findings as SARIF to <file> for the security.yml upload"
usage = 'arg "<file>"'
run = '''
#!/usr/bin/env bash
set -uo pipefail
go tool gomodscan -format sarif > "$usage_file"
rc=$?
if [ "$rc" -gt 1 ]; then exit "$rc"; fi
'''

[tasks.tidy]
description = "Tidy go.mod"
run = "go mod tidy"

[tasks.verify]
description = "Verify dependencies"
run = "go mod verify"

# Vendoring makes new transitive dependencies show up as a visible diff
# at PR review time, turning the trust decision on each addition into a
# human one.
[tasks.vendor]
description = "Vendor dependencies into ./vendor"
run = ["go mod tidy", "go mod vendor"]

# CI runs this on every PR; contributors run `mise run vendor` and commit
# the result.
[tasks.vendor-check]
description = "Check that vendor/, go.mod, and go.sum are in sync"
run = '''
#!/usr/bin/env bash
set -euo pipefail
go mod tidy
go mod vendor
# Use repository rules so personal Git ignores cannot hide vendor drift.
untracked=$(git ls-files --others --exclude-per-directory=.gitignore -- go.mod go.sum vendor/)
if [[ -n $untracked ]] || ! git diff --exit-code -- go.mod go.sum vendor/; then
    echo "vendor drift detected — run 'mise run vendor' and commit" >&2
    exit 1
fi
'''

# Same membership as devtools' lint-go-all minus the workflow linter, which
# the repo-wide lint aggregate already runs.
[tasks.lint-go-all]
description = "Aggregate every Go-flavored lint gate"
run = [
  "mise run lint-go",
  "mise run lint-go-modernize",
  "mise run lint-go-deadcode",
  "mise run lint-go-arch",
]

# --- Python tasks, copied from devtools/mise.toml (upstream candidate: tbhb-dev/devtools#157) ---
# Only the gates that apply to a repo with scripts and no packages yet.
# complexipy, vulture, pylint duplicate detection, bandit, and the mutation
# and fuzz tasks wait until there is Python code worth measuring. test-py and
# cover-py wait too: pytest exits non-zero when it collects nothing, and
# tools/*.py has no pytest suite (the bats suites cover the tool scripts).

[tasks.format-py]
description = "Format Python code in place via ruff's formatter"
run = "uv run ruff format"

# Pair with format-py, which handles layout rather than lint.
[tasks.fix-py]
description = "Fix Python linting issues"
run = "uv run ruff check --fix"

# Report drift and fail without rewriting; format-py is the in-place
# counterpart.
[tasks.lint-ruff-format]
description = "Check Python formatting via ruff's formatter in --check mode"
run = "uv run ruff format --check"

# Rule selection and the justified ignore list live in pyproject.toml
# under [tool.ruff].
[tasks.lint-ruff]
description = "Lint Python against the full ruff ruleset"
run = "uv run ruff check"

# The [tool.pyrefly] tables in pyproject.toml pin every error kind and
# name the project scope. The wrapper exists for agent worktrees, where
# pyrefly's hidden-path skipping leaves it an empty view; see the script
# header.
[tasks.lint-types]
description = "Type check with pyrefly"
run = "bash .devtools/scripts/lint-types.sh"

[tasks.lint-py-all]
description = "Aggregate every Python-flavored lint gate"
run = ["mise run lint-ruff-format", "mise run lint-ruff", "mise run lint-types"]

# Serial by default so a failing run prints a clean, ordered trace; pass
# `mise run test-py -n auto` to fan the suite across xdist workers. pytest
# exits 5 when it collects nothing, which is the state until the first app or
# package lands; that passes here, and any other nonzero exit still fails.
[tasks.test-py]
description = "Run the Python tests; collecting no tests passes until a suite exists"
run = '''
#!/usr/bin/env bash
set -uo pipefail
uv run pytest "$@"
rc=$?
if [[ $rc -eq 5 ]]; then
  echo "test-py: no Python tests collected yet"
  exit 0
fi
exit "$rc"
'''

# Contributors run `uv lock` and commit the result.
[tasks.lock-check]
description = "Check that uv.lock is in sync with pyproject.toml"
run = "uv lock --check"

# uv exports the locked set, every dependency group included, to a
# throwaway pylock.toml, and pip-audit reads
# that and nothing else, so the audit never reaches the live environment.
# The scratch directory, cache included, disappears on exit.
[tasks.audit]
description = "Audit the locked Python dependencies against the advisory database"
run = '''
#!/usr/bin/env bash
set -eu
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
uv export --quiet --all-groups --format pylock.toml --no-emit-project -o "$work/pylock.toml"
uv run pip-audit --cache-dir "$work/cache" --locked "$work"
'''

# --- Ansible tasks (upstream candidate: noted in the Ansible program) ---
# The toolchain is the uv `ops` group, and the collections pinned in
# infra/ansible/requirements.yml install into the gitignored
# infra/ansible/.collections. lint-ansible and test-ansible touch no real
# host; the ops:* tasks do, through tools/ops-ansible.sh.

# Ansible needs UTF-8 even when the commit gates set LC_ALL=C.
[tasks.install-ansible]
description = "Install the pinned Ansible collections into infra/ansible/.collections"
env = { LC_ALL = "C.UTF-8" }
dir = "{{config_root}}/infra/ansible"
run = "uv run --group ops ansible-galaxy collection install -r requirements.yml -p .collections"

# The stub inventory stands in for the private one, so the syntax check
# sees both sources the ops tasks pass.
[tasks.lint-ansible]
description = "Lint the Ansible tree and syntax-check the playbooks against a stub inventory"
env = { LC_ALL = "C.UTF-8" }
depends = ["install-ansible"]
dir = "{{config_root}}/infra/ansible"
run = [
  "uv run --group ops ansible-lint",
  "uv run --group ops ansible-playbook --syntax-check -i inventory -i tests/inventory playbooks/*.yml",
]

# The bats file checks the ssh command line tools/ops-ansible.sh builds,
# against a stub ssh; it lives here because it needs the uv ops group.
# Each run takes MOLECULE_RUN_ID from its own mktemp directory, so no two
# live runs under one TMPDIR share it, and every scenario appends it to its
# platform name.
# Molecule otherwise keeps each scenario's state, inventory and molecule.yml
# in a cache directory every checkout shares, keyed by role and scenario
# name, where another checkout's run could rewrite the platform list a
# destroy reads.
[tasks.test-ansible]
description = "Test the ops ssh options against a stub, then run the Molecule scenarios in Docker"
depends = ["install-ansible"]
dir = "{{config_root}}/infra/ansible"
# Avoid the macOS fork-safety crash when Ansible workers look up system proxies.
env = { LC_ALL = "C.UTF-8", ANSIBLE_COLLECTIONS_PATH = "{{config_root}}/infra/ansible/.collections", ANSIBLE_ROLES_PATH = "{{config_root}}/infra/ansible/roles", no_proxy = "*", NO_PROXY = "*" }
run = [
  "bats {{config_root}}/tools/ops-ansible-ssh.bats",
  '''
state=$(mktemp -d -t molecule-XXXXXXXX)
trap 'rm -rf "$state"' EXIT
MOLECULE_RUN_ID=${state##*-}
export MOLECULE_RUN_ID
for scenario in roles/*/molecule; do
  role=${scenario%/molecule}
  (cd "$role" && MOLECULE_EPHEMERAL_DIRECTORY="$state/${role#roles/}" uv run --group ops molecule test) || exit
done
''',
]

# Extra invocation args reach ansible-playbook, e.g. `--limit edge-1`.
# check and apply also take a playbook name first; see the script header.
[tasks."ops:verify"]
description = "Run the verify playbook against the real hosts as ops-ro"
env = { LC_ALL = "C.UTF-8" }
run = "bash tools/ops-ansible.sh verify"

[tasks."ops:check"]
description = "Dry-run a playbook against the real hosts as ops, with --check --diff"
env = { LC_ALL = "C.UTF-8" }
run = "bash tools/ops-ansible.sh check"

[tasks."ops:apply"]
description = "Apply a playbook to the real hosts as ops; operator-only, refused without a terminal"
env = { LC_ALL = "C.UTF-8" }
run = "bash tools/ops-ansible.sh apply"

# The one apply an agent may run unattended: playbooks/ssh.yml or
# playbooks/runner-pool.yml only, named as ssh or runner-pool, with the ops
# key from a 1Password service account in a private ssh-agent.
[tasks."ops:apply-scoped"]
description = "Apply the ssh or runner-pool playbook as ops through a private agent; allowed without a terminal"
env = { LC_ALL = "C.UTF-8" }
run = "bash tools/ops-ansible.sh apply-scoped"

# --- JS/TS and nx tasks (upstream candidate: pnpm pin and nx tasks, not yet filed) ---
# nx wraps the toolchain: project.json targets call the underlying go, uv,
# or pnpm command, which buys caching and `nx affected`. mise stays the
# entry point for the lint and check contract.

[tasks.install-js]
description = "Install the JS workspace from pnpm-lock.yaml without rewriting it"
run = "pnpm install --frozen-lockfile"

# Extra invocation args append, so `mise run affected -- --base=origin/main`
# picks the comparison point.
[tasks.affected]
description = "Run nx build, test, and lint for the projects the change touches"
run = "pnpm nx affected -t build test lint"
