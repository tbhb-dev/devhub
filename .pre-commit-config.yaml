---
default_stages: [pre-commit, pre-push]

# Hooks never touch vendored third-party code; that source is reviewed at PR
# time as part of vendor-check, not reformatted to match this repo's style.
exclude: ^(vendor/|bin/|dist/|node_modules/|\.nx/|pnpm-lock\.yaml$|uv\.lock$)

# Every hook that runs a project tool goes through `mise run <task>`, so
# the hook and the `mise run` gate execute the same pinned binary. The
# devtools block keeps its own `rev:`, pinned by SHA with a `# frozen:`
# tag comment that devtools:check-pins reads and Renovate's pre-commit
# manager tracks.
#
# Install with `mise run devtools:prek-install`, which sets up the
# commit-msg, pre-commit, pre-push, and post-commit stages. Then run
# `mise run devtools:install-pre-push-hook` to install the combined wrapper.

repos:
  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  # The shared commit-msg gates, and the post-commit hook that deletes the
  # COMMIT_AGENTMSG draft once a commit lands. vale-commit-msg and
  # cspell-commit-msg read this repository's .vale.ini and .cspell.jsonc.
  - repo: https://github.com/tbhb-dev/devtools
    rev: 8dff05b148c3a468dbf0e6e8fb48092bd5cbb418  # frozen: v0.18.0
    hooks:
      - id: commit-trailers
      - id: commitlint
      - id: commit-msg-pre-push
      - id: vale-commit-msg
      - id: cspell-commit-msg
      - id: clear-commit-agentmsg
      - id: guard-markdown

  - repo: local
    hooks:
      - id: ryl
        name: ryl
        entry: mise run devtools:lint-yaml
        language: system
        types: [yaml]

      - id: tombi
        name: tombi (TOML lint and format check)
        entry: mise run devtools:lint-toml
        language: system
        types: [toml]
        pass_filenames: false

      - id: mise-fmt
        name: mise fmt --check
        entry: mise run devtools:lint-mise
        language: system
        files: ^(mise\.toml|\.config/mise/conf\.d/.*\.toml)$
        pass_filenames: false

      - id: lint-shell
        name: shellcheck
        entry: mise run lint-shell
        language: system
        files: ^.*\.sh$
        pass_filenames: false

      - id: lint-shell-fmt
        name: shfmt
        entry: mise run lint-shell-fmt
        language: system
        files: ^.*\.sh$
        pass_filenames: false

      - id: lint-prose
        name: vale (prose)
        entry: mise run lint-prose
        language: system
        types: [markdown]

      - id: cspell
        name: cspell
        entry: mise run devtools:lint-spelling
        language: system
        pass_filenames: false

      - id: rumdl
        name: rumdl
        entry: mise run devtools:lint-markdown
        language: system
        types: [markdown]

      - id: biome
        name: biome (JSON lint and format check)
        entry: mise run devtools:lint-config
        language: system
        files: \.(json|jsonc|json5)$
        pass_filenames: false

      - id: actionlint
        name: actionlint
        entry: mise run devtools:lint-workflows
        language: system
        files: ^\.github/workflows/
        pass_filenames: false

      # Formatting checks for the languages with code in this repo. They fail
      # without rewriting; the fix-go and format-py tasks rewrite.
      - id: go-fmt
        name: go format check
        entry: mise run lint-go-fmt
        language: system
        types: [go]
        pass_filenames: false

      - id: ruff-format
        name: ruff format check
        entry: mise run lint-ruff-format
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff
        name: ruff
        entry: mise run lint-ruff
        language: system
        types: [python]
        pass_filenames: false

      # apm.lock.yaml records no hook declarations, so it stays identical
      # across a bad hook merge; watch the manifest and the settings files
      # instead.
      - id: apm-audit
        name: apm audit
        entry: mise run devtools:lint-apm
        language: system
        files: ^(apm\.(yml|lock\.yaml)$|\.claude/|\.agents/|\.codex/hooks\.json$)
        pass_filenames: false

      - id: apm-deploy
        name: APM frozen-consumer check
        entry: mise run lint-apm-deploy
        language: system
        files: ^(apm\.(yml|lock\.yaml)$|tools/apm-deploy\.txt$|\.claude/|\.agents/)
        pass_filenames: false

      # The vendir drift gate: resync and fail on any difference against
      # what git holds.
      - id: check-vendored
        name: vendir drift check
        entry: mise run check-vendored
        language: system
        files: ^(vendir\.(yml|lock\.yml)$|\.config/mise/conf\.d/|\.devtools/)
        pass_filenames: false

      - id: check-pins
        name: devtools pin agreement
        entry: mise run devtools:check-pins
        language: system
        files: >-
          ^(mise\.toml|apm\.yml|vendir\.yml|\.pre-commit-config\.yaml|\.github/renovate\.json5|\.github/workflows/.*)$
        pass_filenames: false

      # The leak check, at two stages. Staged scans the index blobs, so a
      # private value cannot hide behind a cleaned working file. The message
      # file arrives as the hook's argument. The pre-push stage isn't here:
      # prek hides the Git ref lines. devtools:install-pre-push-hook runs
      # the commit and leak scans before prek, once per push.
      - id: leaks-staged
        name: leak check (staged files)
        entry: mise run devtools:lint-leaks -- --staged
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false

      - id: leaks-commit-msg
        name: leak check (commit message)
        entry: mise run devtools:lint-leaks --
        language: system
        stages: [commit-msg]
