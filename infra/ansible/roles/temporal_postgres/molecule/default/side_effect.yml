---
- name: Check PostgreSQL 16 and retain password evidence
  hosts: all
  become: true
  tasks:
    - name: Read the Temporal user
      ansible.builtin.getent:
        database: passwd
        key: temporal

    - name: Test PostgreSQL 16 and record the password files
      become: true
      become_user: temporal
      environment:
        XDG_RUNTIME_DIR: /run/user/{{ ansible_facts.getent_passwd.temporal[1] }}
        DOCKER_HOST: unix:///run/user/{{ ansible_facts.getent_passwd.temporal[1] }}/docker.sock
      ansible.builtin.command:
        argv: [python3, /tmp/temporal-postgres-acceptance.py, side-effect]
      changed_when: true

- name: Converge PostgreSQL 15 on fresh data
  hosts: all
  become: true
  vars:
    temporal_postgres_major: 15
    temporal_postgres_data_dir: /var/lib/temporal/postgres-15
  roles:
    - temporal_postgres
