---
# Shared by deployment and removal. Private inventory supplies Service names.
# Override these lists if predecessor roles choose different resource names.
temporal_deployment_units:
  - temporal-ui.service
  - temporal-server.service
  - temporal-postgres-dump.timer
  - temporal-postgres-dump.service
  - temporal-postgres.service
temporal_deployment_containers:
  - temporal-ui
  - temporal-server
  - temporal-postgres
temporal_deployment_services:
  - name: "{{ temporal_frontend_service }}"
    port: "{{ temporal_server_frontend_port }}"
    unit: temporal-frontend-tailnet.service
  - name: "{{ temporal_ui_service }}"
    port: "{{ temporal_ui_loopback_port }}"
    unit: temporal-ui-tailnet.service

# Controller-side token; values and item selectors belong in private inventory.
temporal_host_op_token_file: /var/lib/temporal/.config/op/service-account-token
temporal_host_secret_dir: /etc/temporal-host
temporal_host_secret_files:
  - vault: "{{ temporal_host_certificate_items.server.vault }}"
    item: "{{ temporal_host_certificate_items.server.item }}"
    field: ca
    dest: "{{ temporal_host_secret_dir }}/ca.pem"
  - vault: "{{ temporal_host_certificate_items.server.vault }}"
    item: "{{ temporal_host_certificate_items.server.item }}"
    field: certificate
    dest: "{{ temporal_host_secret_dir }}/server.pem"
  - vault: "{{ temporal_host_certificate_items.server.vault }}"
    item: "{{ temporal_host_certificate_items.server.item }}"
    field: private-key
    dest: "{{ temporal_host_secret_dir }}/server.key"
  - vault: "{{ temporal_host_certificate_items.internal.vault }}"
    item: "{{ temporal_host_certificate_items.internal.item }}"
    field: certificate
    dest: "{{ temporal_host_secret_dir }}/client.pem"
  - vault: "{{ temporal_host_certificate_items.internal.vault }}"
    item: "{{ temporal_host_certificate_items.internal.item }}"
    field: private-key
    dest: "{{ temporal_host_secret_dir }}/client.key"
  - vault: "{{ temporal_postgres_op_login_password.vault }}"
    item: "{{ temporal_postgres_op_login_password.item }}"
    field: "{{ temporal_postgres_op_login_password.field }}"
    dest: "{{ temporal_host_secret_dir }}/postgres-password"
temporal_server_postgres_password_file: "{{ temporal_host_secret_dir }}/postgres-password"
temporal_server_certificates:
  - {name: ca, cert_file: "{{ temporal_host_secret_dir }}/ca.pem"}
  - name: server
    cert_file: "{{ temporal_host_secret_dir }}/server.pem"
    key_file: "{{ temporal_host_secret_dir }}/server.key"
  - name: client
    cert_file: "{{ temporal_host_secret_dir }}/client.pem"
    key_file: "{{ temporal_host_secret_dir }}/client.key"
