# Vale configuration. The rule set is the devtools one: Google,
# write-good, proselint, the devtools `project` style under .vale/project
# (copied from tbhb-dev/devtools v0.10.0), and vale-ai-tells with its
# ai-tells and ai-tells-experimental rules promoted to error (D30).
# Commit messages add ai-tells-commits.
#
# `vale sync` downloads the packages into .vale/, where .gitignore keeps
# them out of git.
StylesPath = .vale
MinAlertLevel = warning
Vocab = project
Packages = \
  https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip, \
  https://github.com/errata-ai/proselint/releases/download/v0.3.4/proselint.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-commits.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-experimental.zip

[formats]
COMMIT_EDITMSG = md
COMMIT_AGENTMSG = md
SQUASH_AGENTMSG = md

[*.md]
BasedOnStyles = Vale, Google, project, write-good, proselint, ai-tells, ai-tells-experimental
ai-tells.AIAdjectiveNounPairs = error
ai-tells-experimental.AverageSentenceLength = error
ai-tells-experimental.ComplexWordDensity = error
ai-tells-experimental.ContentDuplication = error
ai-tells-experimental.ContractionAvoidance = error
ai-tells-experimental.HeadingTitleCase = NO
ai-tells-experimental.LongWordDensity = NO
ai-tells-experimental.ParagraphLengthVariance = error
ai-tells-experimental.PassiveDensity = error
ai-tells-experimental.PassiveVoice = error
ai-tells-experimental.PassiveVoiceAdverb = error
ai-tells-experimental.SentenceLengthVariance = error
ai-tells-experimental.SentenceStartEntropy = error
ai-tells-experimental.SentenceStartRepetition = error
ai-tells-experimental.TransitionRepetition = error
ai-tells-experimental.TricolonDensityDocument = error
ai-tells-experimental.VocabularySwap = error
project.Acronyms = error
# ai-tells.ColonUsage (from BasedOnStyles) exempts headings and acronyms,
# so it supersedes project.Colons outside commit messages.
project.Colons = NO
project.HeadingTitleCase = error
project.WordList = error
# Google.Acronyms is disabled: project.Acronyms is the same rule with
# project-specific exceptions (LLM, GPT, DCO). Keeping both enabled fires
# the Google version even after we add an acronym to project exceptions.
Google.Acronyms = NO
Google.Colons = NO
Google.Contractions = error
Google.Ellipses = error
Google.FirstPerson = error
Google.HeadingPunctuation = error
Google.Headings = NO
Google.OxfordComma = error
Google.Parens = NO
# The tagger-based passive rules pinned above (PassiveVoice,
# PassiveVoiceAdverb, PassiveDensity) flag every grammatical passive
# without the predicate-adjective false positives of the regex rules,
# so Google.Passive, write-good.Passive, and write-good.E-Prime stay
# off, and the style no longer ships its own Passive consolidation.
Google.Passive = NO
Google.Ranges = error
Google.Semicolons = error
Google.Spelling = error
Google.We = error
Google.Will = error
Google.WordList = NO
# Same case-insensitive word-substitution shape as WordList above, so
# the same false-positive risk: "Touch ID" is Apple's proper-noun name
# for the biometric feature, and the rule's stock swap rewrites it to
# the nonexistent "tap ID."
Google.WordListCase = NO
proselint.Annotations = NO
proselint.P-Value = error
write-good.Cliches = error
write-good.E-Prime = NO
write-good.Illusions = error
write-good.Passive = NO
write-good.TooWordy = error
write-good.Weasel = error

# Commit messages and squash drafts, the same section devtools uses.
[{COMMIT_EDITMSG,.git/COMMIT_EDITMSG,COMMIT_AGENTMSG,.git/COMMIT_AGENTMSG,SQUASH_AGENTMSG,.git/SQUASH_AGENTMSG}]
BasedOnStyles = Vale, Google, proselint, write-good, \
  ai-tells, ai-tells-commits, ai-tells-experimental, \
  project
ai-tells.AIAdjectiveNounPairs = error
# The DCO trailer pair (Signed-off-by:/Assisted-by:) trips ColonUsage;
# project.Colons carries the trailer exemptions, so it stays on here and
# ColonUsage stays off.
ai-tells.ColonUsage = NO
ai-tells-experimental.AverageSentenceLength = error
ai-tells-experimental.ComplexWordDensity = error
ai-tells-experimental.ContentDuplication = error
ai-tells-experimental.ContractionAvoidance = error
ai-tells-experimental.HeadingTitleCase = NO
ai-tells-experimental.LongWordDensity = NO
ai-tells-experimental.ParagraphLengthVariance = error
ai-tells-experimental.PassiveDensity = error
ai-tells-experimental.PassiveVoice = error
ai-tells-experimental.PassiveVoiceAdverb = error
ai-tells-experimental.SentenceLengthVariance = error
ai-tells-experimental.SentenceStartEntropy = error
ai-tells-experimental.SentenceStartRepetition = error
ai-tells-experimental.TransitionRepetition = error
ai-tells-experimental.TricolonDensityDocument = error
ai-tells-experimental.VocabularySwap = error
project.Colons = error
project.HeadingTitleCase = error
# project.Acronyms is the same rule as Google.Acronyms with the devtools
# exceptions, so only one of the two runs.
Google.Acronyms = NO
Google.Colons = NO
Google.Contractions = error
Google.Ellipses = error
Google.FirstPerson = error
Google.HeadingPunctuation = error
Google.Headings = NO
Google.OxfordComma = error
Google.Parens = NO
# The tagger-based ai-tells-experimental passive rules replace the regex
# ones.
Google.Passive = NO
Google.Ranges = error
Google.Semicolons = error
Google.Spelling = error
Google.We = error
Google.Will = error
Google.WordList = error
proselint.Annotations = NO
proselint.P-Value = error
write-good.Cliches = error
write-good.E-Prime = NO
write-good.Illusions = error
write-good.Passive = NO
write-good.TooWordy = error
write-good.Weasel = error

# The pull request draft inherits the Markdown rule set and drops the
# heading capitalization rule alone. Its level 1 heading holds the title,
# which has to take the Conventional Commits shape because a squash merge
# turns it into a commit subject, and the type opening that shape is
# lowercase by definition. Sentence case and that shape can never both
# hold, so every draft this workflow writes would fail the rule.
[PR_AGENTDESC.md]
project.HeadingTitleCase = NO

[{CHANGELOG.md,.vale/**/*.md,tmp/**/*.md,vendor/**/*.md}]
BasedOnStyles =
