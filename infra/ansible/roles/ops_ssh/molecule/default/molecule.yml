---
# Loading nftables needs CAP_NET_ADMIN. Privileged mode also lets systemd
# run as PID 1, so units and systemd-run exercise the real init behavior.
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  # test-ansible sets MOLECULE_RUN_ID, so concurrent runs get distinct containers.
  - name: edge-1-${MOLECULE_RUN_ID:-local}
    # The repo inventory's groups for edge-1, so the health playbook
    # sees the same memberships and group_vars under the suffixed name.
    groups: [hetzner_dedicated, tailnet]
    # The runner builds this content-addressed image when its cache is missing.
    image: ${MOLECULE_IMAGE}
    pre_build_image: true
    privileged: true
    command: /sbin/init
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
prerun: false
provisioner:
  name: ansible
  # The driver sets community.docker.docker on each host, which inventory
  # group_vars can't override. docker_api talks to the daemon's API
  # instead of piping modules through docker exec stdin.
  connection_options:
    ansible_connection: community.docker.docker_api
  inventory:
    group_vars:
      all:
        ansible_user: ops
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    # The fresh image has nft installed but no validation helper. This
    # exercises the script and both temporary candidates before converge.
    - check
    - converge
    - idempotence
    - verify
    - destroy
