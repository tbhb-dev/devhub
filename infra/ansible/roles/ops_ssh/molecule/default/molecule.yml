---
# Loading nftables needs CAP_NET_ADMIN. Privileged mode also lets systemd
# run as PID 1, so units and systemd-run exercise the real init behavior.
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: edge-1
    image: ubuntu:26.04
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    command: /sbin/init
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
prerun: false
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        ansible_user: ops
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    # The fresh image has nft installed but no validation helper. This
    # exercises the script and both temporary candidates before converge.
    - check
    - converge
    - idempotence
    - verify
    - destroy
