---
# Main quality gate. devhub is a Go, Python, and TypeScript monorepo with
# one Go binary so far, so the gates are the full lint bar, the Go tests
# (coverage threshold plus the race detector, on Linux and macOS), the
# bats suites for the shell tools, the Python checks, and govulncheck.
# Every job installs the pinned toolchain through mise and runs its gate
# through `mise run`, so the mise config stays the single definition of
# what each gate runs. The local `check` aggregate stays in lockstep with
# this workflow.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A lockfile only binds a version it has already seen. Without this, moving
# a pin in mise.toml and leaving mise.lock alone makes mise fetch the new
# version, compute a fresh digest, and rewrite the lockfile in place -- so a
# Renovate PR that touched only the manifest would go green while the
# committed digests drifted from the pins under review. MISE_LOCKED makes
# that a hard failure instead.
env:
  MISE_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Full history: the leak scan below reads every commit a pull
      # request adds, and a shallow clone is refused as incomplete.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Installs every tool the mise config pins -- vendir, uv, pnpm and the
      # rest from mise.toml, the baseline from the vendored conf.d drop-in
      # -- at the version and digest recorded in the lockfile beside each
      # config.
      - name: Set up the toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.3

      # Resyncs the devtools payload in place from vendir.yml, ignoring the
      # lock's stored SHAs, and fails on any difference from the committed
      # tree. That catches a vendored file edited in place, a sync nobody
      # committed, and a manifest bump whose vendir.lock.yml is stale. The
      # in-place sync is safe on a clean CI checkout. The local lint bar runs
      # the locked scratch comparison, check-vendored, so it can't overwrite
      # unstaged edits.
      - name: Check the vendored payload
        run: mise run devtools:check-vendored

      # mise installs the vale binary but does not fetch the style packages
      # .vale.ini declares.
      - name: Sync Vale styles
        run: mise run install-tools

      # guard-markdown backs lint-markdown-wrap. The task installs the
      # version the devtools pin in apm.yml names.
      - name: Install guard-markdown
        run: |
          mise run install-guard-markdown
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: mise run lint

      # The tree scan in `lint` sees only the checkout. This reads every
      # commit, message, and author line the pull request adds, so a value
      # committed and removed again within the branch still fails. CI has no
      # private literals, so this runs the publishable patterns only.
      - name: Scan the pull request for leaks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Scan source commits rather than GitHub's synthetic merge signature.
        run: mise run lint-leaks -- --range "${BASE_SHA}..${HEAD_SHA}"

      - name: Test the shell tools
        run: |
          mise run test-vendored
          mise run test-tools
          mise run test-leaks

  test-matrix:
    name: "test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The first `mise run` in a job otherwise installs the whole
      # configured toolchain rather than the task's own tools. Turning the
      # auto-install off leaves install_args as the single place naming what
      # this job needs.
      - name: Set up the toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.3
          install_args: go

      - name: Run tests with coverage
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run cover-go

      - name: Run tests with race detector
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run test-go-race

  # The matrix job reports as `test (ubuntu-24.04)` and `test (macos-15)`.
  # This job owns the plain name `test`, so the required-check list names
  # one check and stays stable when the matrix changes.
  test:
    name: test
    if: always()
    needs: test-matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Require every matrix leg to pass
        env:
          RESULT: ${{ needs.test-matrix.result }}
        run: |
          if [[ "${RESULT}" != "success" ]]; then
            echo "the test matrix finished as ${RESULT}" >&2
            exit 1
          fi

  # The Python suite is empty until the first app or package lands. test-py
  # passes while pytest collects nothing and fails on any real failure; the
  # lock check runs regardless.
  test-py:
    name: test-py
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pinned uv, which then provisions the interpreter and
      # restores the locked dependency closure from uv.lock.
      - name: Set up the toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.3
          install_args: uv

      - name: Check that uv.lock matches pyproject.toml
        run: mise run lock-check

      - name: Run the Python tests
        run: mise run test-py

  # ansible-lint, the playbook syntax check, and the Molecule scenarios.
  # Molecule needs Docker, which the ubuntu-24.04 runner has. Nothing here
  # connects to a real host.
  ansible:
    name: ansible
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv provisions the interpreter and the locked ops group; bats and jq
      # run the ssh option tests.
      - name: Set up the toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.3
          install_args: uv bats jq

      - name: Lint the Ansible tree
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run lint-ansible

      - name: Run the Molecule scenarios
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run test-ansible

  vuln:
    name: vuln
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.3
          install_args: go

      - name: Run govulncheck
        run: mise run vuln

  vendor-check:
    name: vendor-check
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.3
          install_args: go

      - name: Check vendor drift
        run: mise run vendor-check
