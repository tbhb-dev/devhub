---
# cspell:ignore temporalio
- name: Verify the Temporal UI
  hosts: edge-1
  become: true
  tasks:
    - name: Read the UI defaults
      ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Look up the Temporal user
      ansible.builtin.getent:
        database: passwd
        key: temporal

    - name: Inspect the running UI
      become: true
      become_user: temporal
      environment:
        DOCKER_HOST: unix:///run/user/{{ ansible_facts.getent_passwd.temporal[1] }}/docker.sock
      ansible.builtin.command:
        argv: [docker, inspect, temporal-ui]
      changed_when: false
      register: temporal_ui_inspect

    - name: Check the pinned image and network
      vars:
        temporal_ui_container: "{{ (temporal_ui_inspect.stdout | from_json)[0] }}"
      ansible.builtin.assert:
        that:
          - temporal_ui_container.Config.Image == 'temporalio/ui:' ~ temporal_ui_version ~ '@' ~ temporal_ui_digest
          - temporal_network_name in temporal_ui_container.NetworkSettings.Networks
          - >-
            temporal_ui_container.HostConfig.PortBindings['8080/tcp'] ==
            [{'HostIp':'127.0.0.1', 'HostPort':temporal_ui_loopback_port | string}]

    - name: List namespaces through the UI frontend connection
      ansible.builtin.uri:
        url: http://127.0.0.1:{{ temporal_ui_loopback_port }}/api/v1/namespaces
        use_proxy: false
        return_content: true
      register: temporal_ui_namespaces
      until: temporal_ui_namespaces.status == 200
      retries: 30
      delay: 2

    - name: Read the UI settings
      ansible.builtin.uri:
        url: http://127.0.0.1:{{ temporal_ui_loopback_port }}/api/v1/settings
        use_proxy: false
      register: temporal_ui_settings

    - name: Check namespaces and read-only settings
      ansible.builtin.assert:
        that:
          - "'coord' in temporal_ui_namespaces.json.namespaces | map(attribute='namespaceInfo.name') | list"
          - temporal_ui_settings.json.DisableWriteActions
          - temporal_ui_settings.json.Codec.Endpoint == ''

    - name: Read the UI listening sockets
      ansible.builtin.command:
        argv: [ss, -H, -ltn, sport, '=', ':{{ temporal_ui_loopback_port }}']
      changed_when: false
      register: temporal_ui_sockets

    - name: Check that only IPv4 loopback listens
      ansible.builtin.assert:
        that:
          - temporal_ui_sockets.stdout_lines | length == 1
          - "('127.0.0.1:' ~ temporal_ui_loopback_port) in temporal_ui_sockets.stdout"

    - name: Discover non-loopback addresses
      ansible.builtin.command:
        argv: [ip, -j, address, show, scope, global]
      changed_when: false
      register: temporal_ui_addresses

    - name: Check each non-loopback interface refuses UI access
      ansible.builtin.uri:
        url: >-
          http://{{ '[' ~ item.local ~ ']' if item.family == 'inet6' else item.local
          }}:{{ temporal_ui_loopback_port }}/api/v1/settings
        use_proxy: false
        timeout: 3
      loop: "{{ temporal_ui_addresses.stdout | from_json | map(attribute='addr_info') | flatten }}"
      register: temporal_ui_external
      failed_when: temporal_ui_external.status != -1

    - name: Require at least one negative probe
      ansible.builtin.assert:
        that: temporal_ui_external.results | length > 0
