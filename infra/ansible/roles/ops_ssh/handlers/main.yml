---
# ssh.socket may be listening before ssh.service has ever run. Reload
# only the running daemon; an idle socket starts it with the validated file.
- name: Reload SSH
  ansible.builtin.command:
    cmd: /usr/local/sbin/techops-ssh-revert reload
  changed_when: true

- name: Reload SSH firewall
  ansible.builtin.systemd_service:
    name: techops-ssh.service
    state: reloaded
  when: not (ansible_check_mode and ops_ssh_unit is changed)
