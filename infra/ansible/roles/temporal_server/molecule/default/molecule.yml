---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: edge-1-${MOLECULE_RUN_ID:-local}
    groups: [edge-1]
    image: techops-temporal-server:ubuntu-26.04
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    command: /sbin/init
    cgroupns_mode: private
    volumes: [/var/lib/temporal]
    keep_volumes: false
    tmpfs: [/run, /tmp]
prerun: false
provisioner:
  name: ansible
  connection_options:
    ansible_connection: community.docker.docker_api
  inventory:
    group_vars:
      all:
        ansible_user: ops
        docker_rootless_user: temporal
        docker_rootless_home: /var/lib/temporal
        docker_rootless_data_size: ""
        temporal_network_name: temporal
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
