---
- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

# Pinned by checksum. The key's fingerprint is
# 3FEF 9748 469A DBE1 5DA7 CA80 AC2D 6274 2012 EA22.
- name: Install 1Password's apt signing key
  ansible.builtin.get_url:
    url: https://downloads.1password.com/linux/keys/1password.asc
    dest: /etc/apt/keyrings/1password.asc
    checksum: sha256:f39e7dd9dedc581ced85732832f217e0de5860a3b80279b5af4bc7c6d8157bae
    owner: root
    group: root
    mode: "0644"
  register: temporal_postgres_key

- name: Add 1Password's apt repository
  vars:
    temporal_postgres_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/1password.sources
    content: |
      Types: deb
      URIs: https://downloads.1password.com/linux/debian/{{ temporal_postgres_arch }}
      Suites: stable
      Components: main
      Architectures: {{ temporal_postgres_arch }}
      Signed-By: /etc/apt/keyrings/1password.asc
    owner: root
    group: root
    mode: "0644"
  register: temporal_postgres_source

# A check run hasn't written the repository, so it skips the packages too.
- name: Refresh the package index for the new repository
  ansible.builtin.apt:
    update_cache: true
  when:
    - temporal_postgres_key is changed or temporal_postgres_source is changed
    - not ansible_check_mode

- name: Install the 1Password CLI and Docker API client dependency
  ansible.builtin.apt:
    name: [1password-cli, python3-requests]
    state: present
    install_recommends: false
  when: not (ansible_check_mode and (temporal_postgres_key is changed or temporal_postgres_source is changed))
