# Repository behavior; reviewer identity and delegation stay on the machine.
lint_commit_cmd = mise run lint-commit-msg
required_hooks = commit-msg pre-commit post-commit
hook_marker = File generated by prek
review_max_rounds = 3
pr_template = .github/pull_request_template.md
lint_pr_cmd = mise run lint-pr-description
lint_squash_cmd = mise run lint-squash-msg
# This repository has no golden fixtures.
golden_paths = ^$
# Workflows and actions are an interim hold until a classifier decides them.
owner_paths = ^(\.github/CODEOWNERS|\.github/(workflows|actions)/.*|\.agents/agent-skills\.conf|\.claude/settings[^/]*\.json|\.codex/config\.toml)$
loosening_markers = nolint|shellcheck disable|vale (off|disable)
gate_config_paths = ^(mise\.toml|mise\.lock|\.config/mise/|\.devtools/|\.pre-commit-config\.yaml|\.github/|tools/|\.agents/agent-skills\.conf|\.vale|\.cspell|\.leak-|\.gitleaks\.toml|\.shellcheckrc|\.rumdl\.toml|\.yamllint|\.golangci\.yml|\.go-arch-lint\.yml|\.testcoverage\.yml|\.gremlins\.yaml|pyproject\.toml|biome\.json)
# Preserve every ignored file during unattended cleanup.
disposable_ignored = ^$
