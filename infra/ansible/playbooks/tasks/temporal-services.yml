---
- name: Install the tailnet service units
  ansible.builtin.template:
    src: temporal-tailnet.service.j2
    dest: /etc/systemd/system/{{ item.unit }}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ temporal_deployment_services }}"
  register: temporal_deployment_service_files

- name: Enable the tailnet services
  ansible.builtin.systemd_service:
    name: "{{ item.item.unit }}"
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if item.changed else 'started' }}"
  loop: "{{ temporal_deployment_service_files.results }}"
