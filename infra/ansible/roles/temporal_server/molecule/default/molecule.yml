---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: edge-1-${MOLECULE_RUN_ID:-local}
    groups: [edge-1]
    image: techops-temporal-server:ubuntu-26.04
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    command: /sbin/init
    cgroupns_mode: private
    volumes: [/var/lib/temporal]
    keep_volumes: false
    tmpfs: [/run, /tmp]
prerun: false
provisioner:
  name: ansible
  connection_options:
    ansible_connection: community.docker.docker_api
  inventory:
    group_vars:
      all:
        ansible_user: ops
        docker_rootless_user: temporal
        docker_rootless_home: /var/lib/temporal
        docker_rootless_data_size: ""
        temporal_network_name: temporal
        temporal_server_postgres_password_file: /run/temporal-fixtures/password
        temporal_postgres_op_admin_password: {vault: example-vault, item: example-admin, field: password}
        temporal_postgres_op_login_password: {vault: example-vault, item: example-login, field: password}
        temporal_server_certificates:
          - {name: ca, cert_file: /run/temporal-fixtures/ca.pem}
          - {name: server, cert_file: /run/temporal-fixtures/server.pem, key_file: /run/temporal-fixtures/server.key}
          - {name: client, cert_file: /run/temporal-fixtures/client.pem, key_file: /run/temporal-fixtures/client.key}
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
