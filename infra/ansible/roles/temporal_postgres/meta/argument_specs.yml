---
argument_specs:
  main:
    short_description: Run Temporal's PostgreSQL on rootless Docker
    options:
      temporal_postgres_major:
        type: int
        default: 16
        choices: [16, 15]
        description: PostgreSQL major version; changing it needs a fresh or migrated data directory.
      temporal_postgres_images:
        type: dict
        description: Official PostgreSQL images pinned by digest, keyed by major version as a string.
      temporal_network_name:
        type: str
        default: temporal
        description: User-defined Docker network this role creates for the Temporal services.
      temporal_postgres_data_dir:
        type: path
        default: /var/lib/temporal/postgres
        description: Persistent data directory, mounted at the image's path for the selected major.
      temporal_postgres_max_connections:
        type: int
        default: 100
        description: Connection limit, at least 100.
