---
- name: Remove Temporal while preserving databases and dumps
  hosts: all
  gather_facts: false
  become: true
  vars_files:
    - vars/temporal.yml
  tasks:
    - name: Read installed system services
      ansible.builtin.service_facts:

    - name: Stop and disable the tailnet services
      ansible.builtin.systemd_service:
        name: "{{ item.unit }}"
        state: stopped
        enabled: false
      loop: "{{ temporal_deployment_services }}"
      when: item.unit in ansible_facts.services

    - name: Remove the tailnet unit files
      ansible.builtin.file:
        path: /etc/systemd/system/{{ item.unit }}
        state: absent
      loop: "{{ temporal_deployment_services }}"
      notify: Reload system units

    - name: Look up the Temporal account
      ansible.builtin.getent:
        database: passwd
        key: temporal
        fail_key: false

    - name: Remove resources from the Temporal daemon
      when: ansible_facts.getent_passwd.temporal is not none
      become: true
      become_user: temporal
      environment:
        XDG_RUNTIME_DIR: /run/user/{{ ansible_facts.getent_passwd.temporal[1] }}
        DOCKER_HOST: unix:///run/user/{{ ansible_facts.getent_passwd.temporal[1] }}/docker.sock
      block:
        - name: Read installed Temporal user units
          ansible.builtin.command:
            argv: [systemctl, --user, list-unit-files, --no-legend, --no-pager]
          register: temporal_deployment_user_units
          changed_when: false

        - name: Stop and disable installed Temporal units
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            scope: user
            state: stopped
            enabled: false
          loop: "{{ temporal_deployment_units }}"
          when: item in temporal_deployment_user_units.stdout.split()

        - name: Remove the Temporal containers
          community.docker.docker_container:
            name: "{{ item }}"
            state: absent
          loop: "{{ temporal_deployment_containers }}"

        - name: Remove the Temporal network
          community.docker.docker_network:
            name: "{{ temporal_network_name }}"
            state: absent
  handlers:
    - name: Reload system units
      ansible.builtin.systemd_service:
        daemon_reload: true
