# Relative paths resolve against this file's directory. The ops tasks
# and Molecule pass the inventories, so none is configured here.
[defaults]
collections_path = .collections
roles_path = roles
host_key_checking = True
interpreter_python = auto_silent

# One SSH session per task instead of several. The ops and root runs turn
# connection reuse off, so each session costs a full handshake.
[connection]
pipelining = True
