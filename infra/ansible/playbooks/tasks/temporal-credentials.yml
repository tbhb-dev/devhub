---
- name: Check the controller token source
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ temporal_host_token_source_path }}"
  register: temporal_host_token_source

- name: Require the controller token for a real apply
  ansible.builtin.assert:
    that: temporal_host_token_source.stat.isreg | default(false)
    fail_msg: >-
      Temporal host token source is missing; provision temporal_host_op_token_src on the controller before applying.
    quiet: true
  when: not ansible_check_mode

- name: Provision credentials when the controller token exists
  when: temporal_host_token_source.stat.isreg | default(false)
  block:
    - name: Create the host credential directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: temporal
        group: temporal
        mode: "0700"
      loop:
        - "{{ temporal_host_op_token_file | dirname }}"
        - "{{ temporal_host_secret_dir }}"
        - "{{ temporal_postgres_op_environment_file | default('/etc/temporal-postgres/op.env') | dirname }}"

    - name: Install the host service account token
      ansible.builtin.copy:
        src: "{{ temporal_host_token_source_path }}"
        dest: "{{ temporal_host_op_token_file }}"
        owner: temporal
        group: temporal
        mode: "0400"
      no_log: true

    - name: Install the PostgreSQL service account environment
      ansible.builtin.copy:
        content: |
          OP_SERVICE_ACCOUNT_TOKEN={{ lookup('ansible.builtin.file', temporal_host_token_source_path) | to_json }}
        dest: "{{ temporal_postgres_op_environment_file | default('/etc/temporal-postgres/op.env') }}"
        owner: temporal
        group: temporal
        mode: "0400"
      no_log: true

    - name: Install the password manager CLI
      ansible.builtin.include_role:
        name: temporal_postgres
        tasks_from: password_reader

    - name: Install the managed host credential reader
      ansible.builtin.copy:
        src: temporal-host-read-secret.sh
        dest: /usr/local/bin/temporal-host-read-secret
        owner: root
        group: root
        mode: "0755"

    - name: Read the server credential fields on the managed host
      become: true
      become_user: temporal
      ansible.builtin.command:
        argv:
          - /usr/local/bin/temporal-host-read-secret
          - "{{ temporal_host_op_token_file }}"
          - "{{ item.vault }}"
          - "{{ item.item }}"
          - "{{ item.field }}"
      loop: "{{ temporal_host_secret_files }}"
      register: temporal_host_secrets
      changed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: Install the server credential inputs
      ansible.builtin.copy:
        content: "{{ item.stdout }}\n"
        dest: "{{ item.item.dest }}"
        owner: temporal
        group: temporal
        mode: "0400"
      loop: "{{ temporal_host_secrets.results }}"
      no_log: true
      when: not ansible_check_mode
