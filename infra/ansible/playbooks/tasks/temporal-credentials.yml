---
- name: Inspect the provisioned certificates
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_mime: false
  loop:
    - /etc/temporal-host/ca.pem
    - /etc/temporal-host/server.pem
    - /etc/temporal-host/server.key
    - /etc/temporal-host/client.pem
    - /etc/temporal-host/client.key
    - /var/lib/temporal/.config/temporal-ui/tls/ca.pem
    - /var/lib/temporal/.config/temporal-ui/tls/certificate.pem
    - /var/lib/temporal/.config/temporal-ui/tls/private-key.pem
  register: temporal_host_certificate_files

- name: Require certificates provisioned out of band
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - item.stat.pw_name | default('') == 'temporal'
      - item.stat.gr_name | default('') == 'temporal'
      - item.stat.mode | default('') == '0400'
    fail_msg: Certificates must be provisioned out of band, owned by temporal with mode 0400.
    quiet: true
  loop: "{{ temporal_host_certificate_files.results }}"
