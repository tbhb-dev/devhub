---
- name: Check the PostgreSQL settings
  ansible.builtin.assert:
    that:
      - temporal_postgres_max_connections >= 100
      - temporal_postgres_dump_retention_days > 0
      - temporal_postgres_images[temporal_postgres_major | string] is match('^[^@\s]+@sha256:[0-9a-f]{64}$')
      - temporal_network_name is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - temporal_postgres_op_environment_file is match('^/etc/')
    quiet: true

- name: Set up the Temporal user's rootless daemon
  ansible.builtin.include_role:
    name: docker_rootless
  vars:
    docker_rootless_user: temporal
    docker_rootless_home: /var/lib/temporal
    docker_rootless_data_image: /var/lib/temporal-docker-data.img
    # A different range from the runner pool on the same host.
    docker_rootless_subid_start: 655360

- name: Install the password reader
  ansible.builtin.import_tasks: password_reader.yml

# Nothing under the home is written as root, including Ansible's copies.
- name: Install PostgreSQL as the Temporal user
  become: true
  become_user: temporal
  environment:
    XDG_RUNTIME_DIR: /run/user/{{ docker_rootless_uid }}
    DOCKER_HOST: unix:///run/user/{{ docker_rootless_uid }}/docker.sock
  block:
    - name: Create the PostgreSQL directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - /var/lib/temporal/.local/bin
        - /var/lib/temporal/.config/temporal-postgres
        - "{{ temporal_postgres_dump_dir }}"

    - name: Create the PostgreSQL data mount
      ansible.builtin.file:
        path: "{{ temporal_postgres_data_dir }}"
        state: directory
        mode: "0700"

    - name: Create the Temporal network
      community.docker.docker_network:
        name: "{{ temporal_network_name }}"

    - name: Pull the pinned PostgreSQL image
      community.docker.docker_image:
        name: "{{ temporal_postgres_images[temporal_postgres_major | string] }}"
        source: pull

    - name: Install the database initialization script
      ansible.builtin.copy:
        src: init.sh
        dest: /var/lib/temporal/.config/temporal-postgres/init.sh
        mode: "0644"
      notify: Restart Temporal PostgreSQL

    - name: Install the PostgreSQL scripts
      ansible.builtin.template:
        src: "{{ item }}.sh.j2"
        dest: /var/lib/temporal/.local/bin/temporal-postgres-{{ item }}
        mode: "0700"
      loop: [start, dump]
      diff: false
      notify: Restart Temporal PostgreSQL

    - name: Install the PostgreSQL units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: /var/lib/temporal/.config/systemd/user/{{ item }}
        mode: "0644"
      loop: [temporal-postgres.service, temporal-postgres-dump.service, temporal-postgres-dump.timer]
      notify:
        - Restart Temporal PostgreSQL
        - Restart Temporal PostgreSQL dump timer

    - name: Enable and start PostgreSQL
      ansible.builtin.systemd_service:
        name: temporal-postgres.service
        scope: user
        daemon_reload: true
        enabled: true
        state: started

    - name: Enable and start the dump timer
      ansible.builtin.systemd_service:
        name: temporal-postgres-dump.timer
        scope: user
        enabled: true
        state: started

- name: Apply the PostgreSQL handlers
  ansible.builtin.meta: flush_handlers
