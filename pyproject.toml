# Python toolchain configuration. techops-public is primarily Go and TypeScript;
# this file is the uv workspace root that owns the shared Python gate
# configuration. `package = false` keeps the root virtual: uv syncs the
# dependency groups and any workspace members into .venv without trying to
# build the root. Ported from tbhb-dev/devtools (pyproject.toml), minus the
# gates that need code to measure (complexipy, vulture, pylint duplicate
# detection, bandit, cosmic-ray, hypofuzz).
[project]
name = "techops-workspace"
# Inert. Nothing builds or publishes from this table.
version = "0"
description = "Workspace root for the techops-public Python tooling and packages"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "pip-audit>=2.10.1",
  "pyrefly>=1.0.0",
  "ruff>=0.15.17",
  { include-group = "test" },
]
# The Ansible toolchain under infra/ansible. Exact pins, each the latest
# stable release at least two weeks old when it was chosen, so a lock
# refresh never pulls a release younger than that.
ops = [
  "ansible-core==2.21.4",
  "ansible-lint==26.9.0",
  "molecule==26.9.0",
  "molecule-plugins[docker]==26.10.12",
]
test = [
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
]

[tool.coverage.run]
# Measure branch coverage, not just line coverage: a 100% line score can
# still leave one side of a conditional never taken.
branch = true
# Store paths relative to the project root so per-slot data files from a
# CI matrix combine cleanly across operating systems.
relative_files = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
  # Bodies guarded by TYPE_CHECKING run only under a type checker, never
  # at runtime.
  "if TYPE_CHECKING:",
  # assert_never marks a match arm the type checker has proven
  # unreachable; reaching it at runtime is a bug, not a tested path.
  "assert_never\\(",
  # The module-level entry guard fires only when a file runs as a
  # script, which the test suite never does -- it imports the module.
  "if __name__ == \"__main__\":",
]

[tool.pyrefly]
# The harness directories stay out because they hold deployed copies of
# upstream agent primitives, and .devtools because it holds the vendored
# payload, config templates included.
project-includes = ["apps", "packages", "tools", "tests"]
project-excludes = [".claude", ".agents", ".codex", ".devtools"]
# The strict preset is pyrefly's hardest baseline: it demands parameter
# annotations and refuses implicit Any. The errors table below names each
# diagnostic kind at error severity on top of it, so the gate holds even
# if a later release reshuffles what the preset turns on.
preset = "strict"

# Every error kind pyrefly 1.2 knows, pinned to "error" except the two
# marked below. Several kinds (the implicit-any and unannotated families
# among them) default to off or warn; enumerating the whole catalog turns
# those on and keeps kinds that upstream later demotes from failing
# silently.
#
# The catalog is version-specific and pyrefly reorganizes it between
# releases -- 1.2 dropped `annotation-mismatch` and added roughly
# twenty-five kinds, and an unknown name here is a fatal config error,
# not a warning. Regenerate the list on every pyrefly bump: naming an
# unknown kind makes pyrefly print the full catalog as the accepted
# values, which is the source this table was generated from.
[tool.pyrefly.errors]
abstract-method-call = "error"
assert-type = "error"
bad-argument-count = "error"
bad-argument-type = "error"
bad-assignment = "error"
bad-class-definition = "error"
bad-context-manager = "error"
bad-dunder-all = "error"
bad-function-definition = "error"
bad-index = "error"
bad-instantiation = "error"
bad-keyword-argument = "error"
bad-match = "error"
bad-override = "error"
bad-override-mutable-attribute = "error"
bad-override-param-name = "error"
bad-param-name-override = "error"
bad-raise = "error"
bad-return = "error"
bad-singledispatch-register = "error"
bad-specialization = "error"
bad-typed-dict = "error"
bad-typed-dict-key = "error"
bad-unpacking = "error"
column-type-mismatch = "error"
coverage-missing = "error"
coverage-partial = "error"
deprecated = "error"
direct-abstract-base-instantiation = "error"
division-by-zero = "error"
empty-body = "error"
explicit-any = "error"
implicit-abstract-class = "error"
implicit-any = "error"
implicit-any-attribute = "error"
implicit-any-empty-container = "error"
implicit-any-lambda = "error"
implicit-any-parameter = "error"
implicit-any-type-argument = "error"
# Off, deliberately. This one is a style opinion rather than a type
# error: it rejects `if not lines` and `x if match else y`, the
# truthiness idiom PEP 8 endorses and ruff's own SIM rules push code
# toward. Honoring it would mean spelling every emptiness check as an
# explicit length or None comparison, which reads worse.
implicit-bool = "ignore"
implicit-import = "error"
implicit-reexport = "error"
implicitly-defined-attribute = "error"
incompatible-comparison = "error"
incompatible-overload-residual = "error"
inconsistent-inheritance = "error"
inconsistent-overload = "error"
inconsistent-overload-default = "error"
internal-error = "error"
invalid-abstract-method = "error"
invalid-annotation = "error"
invalid-argument = "error"
invalid-cast = "error"
invalid-decorator = "error"
invalid-inheritance = "error"
invalid-literal = "error"
invalid-overload = "error"
invalid-param-spec = "error"
invalid-pattern = "error"
invalid-self-type = "error"
invalid-sentinel = "error"
invalid-super-call = "error"
invalid-syntax = "error"
invalid-type-alias = "error"
invalid-type-checking-constant = "error"
invalid-type-var = "error"
invalid-type-var-tuple = "error"
invalid-variance = "error"
invalid-yield = "error"
misplaced-ignore = "error"
missing-argument = "error"
missing-attribute = "error"
missing-import = "error"
missing-module-attribute = "error"
missing-override-decorator = "error"
missing-source = "error"
missing-source-for-stubs = "error"
missing-super-call = "error"
name-mismatch = "error"
no-access = "error"
no-any-return = "error"
no-any-return-explicit = "error"
no-any-return-implicit = "error"
no-matching-overload = "error"
non-convergent-recursion = "error"
non-exhaustive-match = "error"
not-a-type = "error"
not-async = "error"
not-callable = "error"
not-iterable = "error"
not-required-key-access = "error"
open-unpacking = "error"
parse-error = "error"
potential-bad-keyword-argument = "error"
protocol-implicitly-defined-attribute = "error"
pytorch-efficiency-lint-cuda-call = "error"
pytorch-efficiency-lint-item-call = "error"
pytorch-efficiency-lint-print-tensor = "error"
pytorch-efficiency-lint-redundant-to-call = "error"
read-only = "error"
redefinition = "error"
redundant-cast = "error"
redundant-condition = "error"
reveal-type = "error"
string-as-iterable = "error"
unannotated-attribute = "error"
unannotated-parameter = "error"
unannotated-protocol-member = "error"
unannotated-return = "error"
unbound-name = "error"
unexpected-keyword = "error"
unexpected-positional-argument = "error"
unimported-directive = "error"
unknown-argument-type = "error"
unknown-attribute-type = "error"
unknown-column = "error"
unknown-name = "error"
unknown-variable-type = "error"
unnecessary-comparison = "error"
unnecessary-type-conversion = "error"
unreachable = "error"
unreachable-match-case = "error"
unresolvable-dunder-all = "error"
unsafe-overlap = "error"
unsupported = "error"
unsupported-delete = "error"
unsupported-dynamic-base = "error"
unsupported-operation = "error"
untyped-class-decorator = "error"
untyped-function-decorator = "error"
untyped-import = "error"
# Off, deliberately. Discarding a return value is how large parts of the
# standard library are meant to be used -- argparse's add_argument
# returns an Action nobody keeps. Assigning each one to `_` would add
# noise at every call site to satisfy a rule that catches nothing here.
unused-call-result = "ignore"
unused-coroutine = "error"
unused-ignore = "error"
unused-type-ignore = "error"
useless-overload-body = "error"
variance-mismatch = "error"

[tool.pytest]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
]
testpaths = ["apps", "packages", "tests"]

[tool.ruff]
line-length = 88
# .claude/, .agents/, and .codex/ hold deployed copies of upstream agent
# primitives, and .devtools/ the vendored payload with its own ruff.toml
# template. Both answer to upstream's gates rather than this repo's.
exclude = [".claude", ".agents", ".codex", ".devtools"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # COM812 and ISC001 conflict with the formatter; ruff itself warns
  # when they are enabled alongside `ruff format`.
  "COM812",
  "ISC001",
  # Docstrings belong where they carry signal, not on every module,
  # class, and function as ritual. The pydocstyle shape rules (D2xx,
  # D4xx) still apply to every docstring that does exist.
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  # License headers ride the two-line SPDX comment the Go sources also
  # carry; CPY001 only runs under preview mode anyway.
  "CPY",
  # Plain TODO comments are allowed; requiring an author (TD002), an
  # issue link (TD003), or treating each one as a defect (FIX002) turns
  # lightweight notes into ceremony.
  "TD002",
  "TD003",
  "FIX002",
]

[tool.ruff.lint.mccabe]
# Sonar's default cyclomatic complexity ceiling.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# S101: asserts are pytest's assertion API. PLR2004: literal expected
# values read better in tests than named constants. INP001: test dirs
# are intentionally __init__-free under pytest's importlib mode. FBT001:
# a parametrized expected value is data, not a behavior flag.
"tests/**" = ["S101", "PLR2004", "INP001", "FBT001"]
"**/test_*.py" = ["S101", "PLR2004", "INP001", "FBT001", "S603", "S607"]

# tools/ holds the repo-local standalone scripts, which are command-line
# tools whose output is the product, so print is the interface. S603 and
# S607 join because these scripts invoke vale, git, and apm by bare name on
# purpose: the pinned toolchain puts them on PATH.
"tools/*.py" = ["T201", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
# Virtual root: sync the groups and the members, build nothing here.
package = false
# mise pins uv in [tools], but that pin binds only where mise resolves
# PATH. This floor is uv refusing to run rather than uv.lock churning when
# a resolver from another minor line rewrites it. Move it with the mise pin.
required-version = ">=0.13.1,<0.14"

[tool.uv.workspace]
# Members arrive with apps/ and packages/ content; both directories are
# empty today, and a glob that matches nothing locks cleanly.
members = ["apps/*", "packages/*"]
