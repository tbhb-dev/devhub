---
# APM consumer manifest. Pulls the shared devtools agent primitives for
# Claude and Codex. agy has no APM deployment: its only channel is the
# root AGENTS.md. Keep the bare repository dependency so both harnesses
# receive the sibling lifecycle and unattended skills together.
# Move it with `mise run devtools:update-pins <version>`, and redeploy with
# `mise run apm-sync`, not a bare `apm install`.
name: techops
version: 0.1.0
description: APM consumer manifest for techops-public
target:
  - claude
  - codex
dependencies:
  apm:
    - tbhb-dev/devtools#v0.17.0
  mcp: []
