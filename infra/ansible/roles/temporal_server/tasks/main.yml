---
# cspell:ignore noout enddate slirp4netns
- name: Validate the server contract
  ansible.builtin.assert:
    that:
      - temporal_network_name is defined
      - temporal_server_postgres_host is defined
      - temporal_server_postgres_user is defined
      - temporal_server_postgres_password_file is defined
      - temporal_server_admin_tools_version == temporal_server_version
      - temporal_server_digest is match('^sha256:[0-9a-f]{64}$')
      - temporal_server_admin_tools_digest is match('^sha256:[0-9a-f]{64}$')
      - temporal_server_version is version('1.31.0', '>=')
      - temporal_server_certificates | map(attribute='name') | sort == ['ca', 'client', 'server']
      - temporal_server_frontend_port != temporal_server_metrics_port
    quiet: true

- name: Reject throughput and history limit overrides
  ansible.builtin.assert:
    that:
      - item is not match('^limit\.history(Size|Count)')
      - item is not match('^(matching|frontend)\..*[Rr][Pp][Ss]')
      - item is not match('^(matching|frontend)\..*[Rr]ate')
    quiet: true
  loop: "{{ temporal_server_dynamic_config.keys() | list }}"

- name: Install certificate and runtime tools
  ansible.builtin.apt:
    name: [openssl, python3, slirp4netns]
    state: present
    install_recommends: false

- name: Look up the temporal account supplied by temporal_postgres
  ansible.builtin.getent:
    database: passwd
    key: temporal

- name: Record the temporal runtime paths
  ansible.builtin.set_fact:
    temporal_server_uid: "{{ ansible_facts.getent_passwd.temporal[1] }}"
    temporal_server_home: "{{ ansible_facts.getent_passwd.temporal[4] }}"

- name: Create the shared certificate metrics directory
  ansible.builtin.file:
    path: "{{ temporal_textfile_dir }}"
    state: directory
    owner: temporal
    group: temporal
    mode: "0755"

- name: Install and reconcile as temporal
  become: true
  become_user: temporal
  environment:
    XDG_RUNTIME_DIR: /run/user/{{ temporal_server_uid }}
    DOCKER_HOST: unix:///run/user/{{ temporal_server_uid }}/docker.sock
  block:
    - name: Require the predecessor's network
      ansible.builtin.command: docker network inspect {{ temporal_network_name }}
      changed_when: false

    - name: Create user owned directories
      ansible.builtin.file:
        path: "{{ temporal_server_home }}/{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - .config/temporal-server
        - .config/temporal-server/tls
        - .config/systemd/user
        - .config/systemd/user/docker.service.d
        - .local/bin

    # pasta's implicit forwarding exposes listeners on every host interface.
    - name: Require explicit port forwarding for the Temporal daemon
      ansible.builtin.copy:
        content: |
          [Service]
          Environment=DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns
          Environment=DOCKERD_ROOTLESS_ROOTLESSKIT_PORT_DRIVER=builtin
        dest: "{{ temporal_server_home }}/.config/systemd/user/docker.service.d/temporal-server.conf"
        mode: "0600"
      notify:
        - Restart Temporal Docker networking
        - Restart Temporal server

    - name: Install the CA and leaf certificates
      ansible.builtin.copy:
        src: "{{ item.cert_file }}"
        dest: "{{ temporal_server_home }}/.config/temporal-server/tls/{{ item.name }}.pem"
        remote_src: true
        mode: "0600"
      loop: "{{ temporal_server_certificates }}"
      no_log: true
      notify: Restart Temporal server

    - name: Install the leaf keys
      ansible.builtin.copy:
        src: "{{ item.key_file }}"
        dest: "{{ temporal_server_home }}/.config/temporal-server/tls/{{ item.name }}.key"
        remote_src: true
        mode: "0600"
      loop: "{{ temporal_server_certificates }}"
      when: item.name != 'ca'
      no_log: true
      notify: Restart Temporal server

    - name: Render the server configuration and runtime scripts
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ temporal_server_home }}/{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - {src: config.yml.j2, dest: .config/temporal-server/config.yml, mode: "0600"}
        - {src: temporal-server-start.sh.j2, dest: .local/bin/temporal-server-start, mode: "0700"}
        - {src: temporal-server.service.j2, dest: .config/systemd/user/temporal-server.service, mode: "0600"}
      notify: Restart Temporal server

    - name: Mount the dynamic configuration without default limit overrides
      ansible.builtin.copy:
        content: "{{ temporal_server_dynamic_config | to_nice_yaml }}"
        dest: "{{ temporal_server_home }}/.config/temporal-server/dynamic.yml"
        mode: "0600"
      notify: Restart Temporal server

    - name: Install namespace reconciliation
      ansible.builtin.copy:
        src: reconcile.py
        dest: "{{ temporal_server_home }}/.local/bin/temporal-server-reconcile"
        mode: "0700"

    - name: Write desired namespaces and search attributes
      ansible.builtin.copy:
        content: >-
          {{ {'namespaces': temporal_server_namespaces, 'attributes': temporal_server_search_attributes,
              'server_name': temporal_server_tls_server_name,
              'admin_image': temporal_server_admin_image} | to_nice_json }}
        dest: "{{ temporal_server_home }}/.config/temporal-server/namespaces.json"
        mode: "0600"

    - name: Restart before reconciling namespaces
      ansible.builtin.meta: flush_handlers

    - name: Enable and start Temporal
      ansible.builtin.systemd_service:
        name: temporal-server.service
        scope: user
        daemon_reload: true
        enabled: true
        state: started

    - name: Reconcile namespaces and attributes
      ansible.builtin.command:
        argv:
          - "{{ temporal_server_home }}/.local/bin/temporal-server-reconcile"
          - "{{ temporal_server_home }}/.config/temporal-server/namespaces.json"
      register: temporal_server_reconcile
      changed_when: "'changed' in temporal_server_reconcile.stdout_lines"

    - name: Read installed certificate expiry dates
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ temporal_server_home }}/.config/temporal-server/tls/{{ item.name }}.pem"
          - -noout
          - -enddate
      loop: "{{ temporal_server_certificates }}"
      register: temporal_server_expiry
      changed_when: false

    - name: Publish certificate expiry timestamps
      ansible.builtin.template:
        src: certificates.prom.j2
        dest: "{{ temporal_textfile_dir }}/temporal-server.prom"
        mode: "0644"
